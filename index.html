          <label>Tipo (opcional)<input data-accion="comp-campo" data-dia="${d.id}" data-comp="${c.id}" data-campo="tipo" value="${esc(c.tipo)}" placeholder="arroz, pasta..."></label>
          <label class="check ancho"><input type="checkbox" data-accion="comp-campo" data-dia="${d.id}" data-comp="${c.id}" data-campo="confirmado" ${c.confirmado ? 'checked' : ''}>
            Confirmado ${c.origen === 'sugerido' && !c.confirmado ? '<span class="etq pend">sugerencia sin confirmar</span>' : ''}</label>
          <div class="ancho"><button class="pequeno peligro" data-accion="comp-borrar" data-dia="${d.id}" data-comp="${c.id}">Quitar</button></div>
        </div>`).join('');
      return `<section class="tarjeta">
        <h3>${d.nombre}</h3>
        <label>Menú (escribe o pega el texto)<textarea data-accion="menu-texto" data-dia="${d.id}" placeholder="Ej.: Macarrones con tomate, pollo asado con ensalada, fruta">${esc(m.texto)}</textarea></label>
        <div class="acciones" style="margin-top:0"><button class="pequeno" data-accion="sugerir" data-dia="${d.id}">Sugerir componentes</button>
          <button class="pequeno" data-accion="comp-nuevo" data-dia="${d.id}">+ Componente</button></div>
        ${comps ? `<div style="margin-top:10px">${comps}</div>` : ''}
      </section>`;
    }).join('');

    const palabras = datos.palabrasClave.slice().sort((a, b) => Util.compararTexto(a.termino, b.termino)).map(p =>
      `<li class="fila entre"><span>${esc(p.termino)} → <b>${esc(Datos.nombreCategoria(datos, p.categoriaId))}</b>${p.tipo ? ' (' + esc(p.tipo) + ')' : ''}</span>
        <button class="pequeno peligro" data-accion="pc-borrar" data-id="${p.id}">Quitar</button></li>`).join('');

    return `<h2>Menú del colegio</h2>
      <div class="aviso info">Las clasificaciones sugeridas son solo propuestas. El planificador solo usa los componentes que marques como <b>confirmados</b>.</div>
      ${dias}
      <div class="acciones"><button class="peligro" data-accion="vaciar-semana">Vaciar menú de la semana</button></div>
      <details class="tarjeta"><summary>Palabras clave para sugerencias (${datos.palabrasClave.length})</summary>
        <p class="suave">Si el texto del menú contiene la palabra, se sugiere el componente. Las palabras que coinciden con una exclusión (p. ej. judías verdes) nunca se sugieren.</p>
        <div class="rejilla3"><label>Palabra<input id="pc-termino"></label><label>Categoría<select id="pc-categoria">${opcionesCategorias('hidrato')}</select></label>
          <label>Tipo<input id="pc-tipo" placeholder="opcional"></label></div>
        <button class="pequeno primario" data-accion="pc-nueva">Añadir palabra</button>
        <ul class="lista" style="margin-top:10px">${palabras}</ul>
      </details>`;
  }

  /* =======================================================
     PANTALLA: RECETARIO
     ======================================================= */
  function vistaRecetas() {
    const ctx = Planificador.crearContexto(datos);
    const f = Util.normalizarTexto(filtroRecetas);
    const lista = datos.recetas.filter(r => !f || Util.normalizarTexto(r.nombre).includes(f))
      .sort((a, b) => Util.compararTexto(a.nombre, b.nombre));
    const tarjetas = lista.map(r => {
      const an = ctx.analisis[r.id];
      const cats = [...new Set(Recetas.ingredientesDe(datos, r).map(i => Datos.nombreCategoria(datos, i.categoriaId)))];
      return `<article class="tarjeta">
        <div class="fila entre"><h3>${esc(r.nombre)}</h3>${etqEjemplo(r)}</div>
        ${r.descripcion ? `<p class="suave">${esc(r.descripcion)}</p>` : ''}
        <div>${cats.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>
        <div class="fila" style="margin-top:6px"><span class="hc">${Util.formatearNumero(an.hidratos.total)} g HC${an.hidratos.estado === 'completo' ? '' : ' (parcial)'}</span>${etqHc(an.hidratos.estado)}${etqAlergia(an.alergenos.estado)}</div>
        <div class="acciones"><button class="pequeno" data-accion="receta-editar" data-id="${r.id}">Ver / editar</button>
          <button class="pequeno" data-accion="receta-duplicar" data-id="${r.id}">Duplicar</button>
          <button class="pequeno peligro" data-accion="receta-borrar" data-id="${r.id}">Eliminar</button></div>
      </article>`;
    }).join('');
    return `<div class="fila entre"><h2>Recetario</h2><button class="primario" data-accion="receta-nueva">+ Nueva receta</button></div>
      <input class="buscador" type="search" placeholder="Buscar receta" data-accion="filtro-recetas" value="${esc(filtroRecetas)}">
      ${tarjetas || '<div class="vacio">No hay recetas. Crea primero los ingredientes y luego la receta.</div>'}`;
  }

  /* =======================================================
     PANTALLA: INGREDIENTES
     ======================================================= */
  function vistaIngredientes() {
    const terminos = Alergenos.terminosActivos(datos);
    const f = Util.normalizarTexto(filtroIngredientes);
    const lista = datos.ingredientes.filter(i => !f || Util.normalizarTexto(i.nombre).includes(f))
      .sort((a, b) => Util.compararTexto(a.nombre, b.nombre));
    const tarjetas = lista.map(i => {
      const dato = Hidratos.estadoDatoIngrediente(i);
      const al = Alergenos.comprobarIngrediente(i, terminos);
      const usos = Ingredientes.recetasQueLoUsan(datos, i.id).length;
      const hc = Util.esNumero(i.hc.gramos) ? `${Util.formatearNumero(i.hc.gramos)} g HC / ${Util.formatearNumero(i.hc.base)} g (${C.ESTADOS_PESO[i.hc.estadoPeso]})` : 'Sin dato de HC';
      return `<article class="tarjeta compacta">
        <div class="fila entre"><b>${esc(i.nombre)}</b>${etqEjemplo(i)}</div>
        <div class="suave" style="font-size:.88rem">${esc(Datos.nombreCategoria(datos, i.categoriaId))}${i.tipo ? ' · ' + esc(i.tipo) : ''} · ${hc} · en ${usos} receta(s)</div>
        <div class="fila" style="margin-top:4px">${etq(dato.estado === 'completo' ? 'Dato completo' : dato.estado === 'pendiente' ? 'Dato por confirmar' : 'Dato incompleto', C.ESTADOS_HC[dato.estado].clase)}
          ${etqAlergia(al.estado)}</div>
        <div class="acciones"><button class="pequeno" data-accion="ing-editar" data-id="${i.id}">Ver / editar</button>
          <button class="pequeno peligro" data-accion="ing-borrar" data-id="${i.id}">Eliminar</button></div>
      </article>`;
    }).join('');
    return `<div class="fila entre"><h2>Ingredientes</h2><button class="primario" data-accion="ing-nuevo">+ Nuevo</button></div>
      <input class="buscador" type="search" placeholder="Buscar ingrediente" data-accion="filtro-ingredientes" value="${esc(filtroIngredientes)}">
      ${tarjetas || '<div class="vacio">No hay ingredientes todavía.</div>'}`;
  }

  /* =======================================================
     PANTALLA: REGLAS DE COMPLEMENTARIEDAD
     ======================================================= */
  function vistaReglas() {
    const lista = datos.reglas.slice().sort((a, b) => a.prioridad - b.prioridad || Util.compararTexto(a.nombre, b.nombre));
    const tarjetas = lista.map(r => `<article class="tarjeta compacta">
        <div class="fila entre"><b>${esc(r.nombre)}</b><span>${etqEjemplo(r)} ${etq('Prioridad ' + r.prioridad, 'info')}</span></div>
        <p>${esc(Reglas.describir(r, datos))}</p>
        ${r.descripcion ? `<p class="suave">${esc(r.descripcion)}</p>` : ''}
        <label class="check"><input type="checkbox" data-accion="regla-activa" data-id="${r.id}" ${r.activa ? 'checked' : ''}> Activa</label>
        <div class="acciones"><button class="pequeno" data-accion="regla-editar" data-id="${r.id}">Editar</button>
          <button class="pequeno peligro" data-accion="regla-borrar" data-id="${r.id}">Eliminar</button></div>
      </article>`).join('');
    return `<div class="fila entre"><h2>Reglas</h2><button class="primario" data-accion="regla-nueva">+ Nueva regla</button></div>
      <div class="aviso info">Prioridad 1 = la más importante. Las exclusiones de alérgenos se aplican siempre antes y por encima de cualquier regla.
        Si dos reglas se contradicen con la misma prioridad, el día queda pendiente de revisar.</div>
      ${tarjetas || '<div class="vacio">No hay reglas. Sin reglas, todas las propuestas quedarán pendientes de revisar.</div>'}`;
  }

  /* =======================================================
     PANTALLA: REVISIÓN DE ALÉRGENOS
     ======================================================= */
  function vistaAlergenos() {
    const plan = Planificador.planificarSemana(datos);
    const rev = Revision.estado(datos, plan.huella, plan.dias);
    const terminos = Alergenos.terminosActivos(datos);

    const resumenDias = plan.dias.map(d => {
      const nombreDia = C.DIAS.find(x => x.id === d.diaId).nombre;
      if (!d.receta) return `<li><b>${nombreDia}:</b> <span class="suave">sin cena</span></li>`;
      const ings = d.receta.lineas.map(l => Ingredientes.buscar(datos, l.ingredienteId)).filter(Boolean);
      return `<li><b>${nombreDia}:</b> ${esc(d.receta.nombre)} ${etqAlergia(d.alergenos.estado)}
        <ul class="motivos">${ings.map(i => `<li><b>${esc(i.nombre)}</b>${i.procesado ? ' (procesado)' : ''}: ${i.composicion ? esc(i.composicion) : '<span class="suave">sin composición indicada</span>'}${i.trazas ? ' · Trazas: ' + esc(i.trazas) : ''}</li>`).join('')}</ul>
        ${listaMotivos(d.alergenos.motivos)}</li>`;
    }).join('');

    function bloqueFase(fase) {
      const def = Revision.FASES[fase];
      const est = rev[fase];
      const habilitada = fase === 'fase1' || rev.fase1 === 'confirmada';
      const fecha = datos.revisionAlergenos[fase] ? new Date(datos.revisionAlergenos[fase].fecha).toLocaleString('es-ES') : '';
      const etiquetaEstado = est === 'confirmada' ? etq('Confirmada ' + fecha, 'ok') : est === 'caducada' ? etq('Caducada: los datos cambiaron', 'pend') : etq('Pendiente', 'sin');
      const todas = def.puntos.every((_, i) => marcasRevision[fase].has(i));
      return `<section class="tarjeta"><div class="fila entre"><h3>${def.titulo}</h3>${etiquetaEstado}</div>
        ${def.puntos.map((p, i) => `<label class="check"><input type="checkbox" data-accion="rev-marca" data-fase="${fase}" data-i="${i}" ${marcasRevision[fase].has(i) ? 'checked' : ''} ${habilitada ? '' : 'disabled'}> ${esc(p)}</label>`).join('')}
        <button class="primario" data-accion="rev-confirmar" data-fase="${fase}" ${habilitada && todas ? '' : 'disabled'}>Confirmar ${def.titulo.toLowerCase()}</button>
        ${habilitada ? '' : '<p class="suave">Disponible tras confirmar la primera revisión.</p>'}
      </section>`;
    }

    const grupos = C.EXCLUSIONES.map(e => e.id).concat([C.ID_GENERAL]).map(ex => {
      const ts = terminos.filter(t => t.exclusion === ex);
      return `<details><summary>${esc(Alergenos.nombreExclusion(ex))} (${ts.length})</summary><ul class="lista">
        ${ts.map(t => `<li class="fila entre"><span>${t.origen === 'base' ? '🔒 ' : ''}${esc(t.termino)} ${etq(t.accion === 'bloquear' ? 'bloquea' : 'revisar', t.accion === 'bloquear' ? 'bloq' : 'pend')}</span>
          ${t.origen === 'usuario' ? `<button class="pequeno peligro" data-accion="ter-borrar" data-id="${t.id}">Quitar</button>` : ''}</li>`).join('')}</ul></details>`;
    }).join('');

    return `<h2>Revisión de alérgenos</h2>
      <div class="aviso bloq"><b>Exclusiones absolutas</b> (no se pueden desactivar): ${C.EXCLUSIONES.map(e => esc(e.nombre)).join(' · ')}.</div>
      <div class="aviso info">La app nunca afirma que un plato sea seguro. Solo indica si ha detectado o no coincidencias en los datos introducidos. La revisión final es tuya.</div>
      ${rev.completada ? '<div class="aviso ok">✓ Revisión de la semana confirmada en sus dos fases.</div>' : ''}
      ${rev.hayBloqueadas ? '<div class="aviso bloq">Hay cenas bloqueadas en la semana. Cámbialas en el resumen semanal.</div>' : ''}
      <section class="tarjeta"><h3>Cenas de la semana</h3><ul class="lista">${resumenDias}</ul></section>
      ${bloqueFase('fase1')}${bloqueFase('fase2')}
      <section class="tarjeta"><h3>Términos y derivados que se buscan</h3>
        <p class="suave">Se buscan sin tildes ni mayúsculas y admitiendo plurales, en nombre, composición, trazas y notas de cada ingrediente. 🔒 = término de serie (no se puede quitar).</p>
        ${grupos}
        <hr class="separador">
        <div class="rejilla3"><label>Nuevo término<input id="ter-termino" placeholder="Ej.: caseinato"></label>
          <label>Exclusión<select id="ter-exclusion">${opciones(C.EXCLUSIONES.map(e => [e.id, e.nombre]).concat([[C.ID_GENERAL, 'Revisión general']]), 'huevo')}</select></label>
          <label>Si aparece<select id="ter-accion">${opciones({ bloquear: 'Bloquear receta', revisar: 'Pedir revisión' }, 'bloquear')}</select></label></div>
        <button class="primario pequeno" data-accion="ter-nuevo">Añadir término</button>
      </section>`;
  }

  /* =======================================================
     PANTALLA: CONFIGURACIÓN Y COPIAS DE SEGURIDAD
     ======================================================= */
  function vistaAjustes() {
    const numEjemplos = datos.ingredientes.filter(i => i.ejemplo).length + datos.recetas.filter(r => r.ejemplo).length + datos.reglas.filter(r => r.ejemplo).length;
    const cats = datos.categorias.map(c => `<li class="fila entre"><input data-accion="cat-nombre" data-id="${c.id}" value="${esc(c.nombre)}" style="flex:1;margin:0">
      <button class="pequeno peligro" data-accion="cat-borrar" data-id="${c.id}">Quitar</button></li>`).join('');
    return `<h2>Ajustes y copias de seguridad</h2>
      <div class="aviso pend"><b>Importante:</b> los datos se guardan solo en este navegador y en este dispositivo. <b>No se sincronizan</b> entre dispositivos.
        Si borras los datos del navegador, lo reinstalas o cambias de móvil, los perderás salvo que tengas una copia de seguridad.</div>
      <section class="tarjeta"><h3>Copia de seguridad</h3>
        <p class="suave">Contiene: ${esc(CopiaSeguridad.resumen(datos))}, menús, palabras clave, términos y categorías.</p>
        <div class="acciones"><button class="primario" data-accion="exportar">Exportar copia (JSON)</button>
          <label class="boton" style="margin:0;color:var(--texto);display:inline-flex;align-items:center">Importar copia<input type="file" accept=".json,application/json" data-accion="importar" style="display:none"></label></div>
      </section>
      <section class="tarjeta"><h3>Categorías de componentes</h3>
        <ul class="lista">${cats}</ul>
        <div class="fila" style="margin-top:8px"><input id="cat-nueva" placeholder="Nueva categoría" style="flex:1;margin:0"><button class="pequeno primario" data-accion="cat-nueva">Añadir</button></div>
      </section>
      <section class="tarjeta"><h3>Datos de ejemplo</h3>
        <p class="suave">Hay ${numEjemplos} elemento(s) de ejemplo con datos ficticios.</p>
        <button class="peligro" data-accion="borrar-ejemplos" ${numEjemplos ? '' : 'disabled'}>Eliminar datos de ejemplo</button>
      </section>
      <p class="suave">Versión de datos: ${C.VERSION_DATOS}. Almacenamiento: ${almacenOk ? 'localStorage disponible' : 'NO disponible'}.</p>`;
  }

  /* =======================================================
     FORMULARIOS (diálogo)
     ======================================================= */
  const dialogo = $('#dialogo');
  let borrador = null; // objeto que se está editando
  let tipoBorrador = null;

  function abrirDialogo(titulo, cuerpo, tipo, objeto) {
    borrador = objeto; tipoBorrador = tipo;
    dialogo.innerHTML = `<div class="dialogo-cab"><h3 style="margin:0">${esc(titulo)}</h3><button class="pequeno" data-accion="dlg-cerrar">Cerrar</button></div>
      <div class="dialogo-cuerpo">${cuerpo}</div>
      <div class="dialogo-pie"><button data-accion="dlg-cerrar">Cancelar</button><button class="primario" data-accion="dlg-guardar">Guardar</button></div>`;
    if (dialogo.showModal) dialogo.showModal(); else dialogo.setAttribute('open', '');
  }
  function cerrarDialogo() { if (dialogo.close) dialogo.close(); else dialogo.removeAttribute('open'); borrador = null; tipoBorrador = null; }

  /* ---- Ingrediente ---- */
  function formularioIngrediente(ing) {
    const tipos = [...new Set(datos.ingredientes.map(i => i.tipo).filter(Boolean))];
    return `<datalist id="lista-tipos">${tipos.map(t => `<option value="${esc(t)}">`).join('')}</datalist>
      ${ing.ejemplo ? '<div class="aviso pend">Ingrediente de EJEMPLO con datos ficticios.</div>' : ''}
      <label>Nombre *<input name="nombre" value="${esc(ing.nombre)}"></label>
      <div class="rejilla2"><label>Categoría<select name="categoriaId">${opcionesCategorias(ing.categoriaId)}</select></label>
        <label>Tipo (opcional)<input name="tipo" list="lista-tipos" value="${esc(ing.tipo)}" placeholder="arroz, pasta, pollo..."></label></div>
      <fieldset><legend>Hidratos de carbono</legend>
        <div class="rejilla3"><label>Gramos de HC<input name="hcGramos" inputmode="decimal" value="${ing.hc.gramos == null ? '' : esc(ing.hc.gramos)}"></label>
          <label>Por cada (g)<input name="hcBase" inputmode="decimal" value="${esc(ing.hc.base)}"></label>
          <label>Peso del dato<select name="hcEstadoPeso">${opciones(C.ESTADOS_PESO, ing.hc.estadoPeso)}</select></label></div>
        <div class="rejilla2"><label>Fuente del dato<select name="fuenteClase"><option value="">— Sin indicar —</option>${opciones(C.FUENTES, ing.fuente.clase)}</select></label>
          <label>Detalle de la fuente<input name="fuenteDetalle" value="${esc(ing.fuente.detalle)}" placeholder="Qué tabla, qué marca..."></label></div>
        <label class="check"><input type="checkbox" name="verificado" ${ing.verificado ? 'checked' : ''}> He comprobado este dato</label>
      </fieldset>
      <fieldset><legend>Composición y alérgenos</legend>
        <label class="check"><input type="checkbox" name="procesado" ${ing.procesado ? 'checked' : ''}> Es un producto procesado (envasado, salsa, embutido, pan...)</label>
        <label>Composición / lista de ingredientes<textarea name="composicion" placeholder="Copia la lista de ingredientes de la etiqueta">${esc(ing.composicion)}</textarea></label>
        <label class="check"><input type="checkbox" name="composicionCompleta" ${ing.composicionCompleta ? 'checked' : ''}> La composición está completa</label>
        <div class="rejilla2">${C.EXCLUSIONES.map(e => `<label>${esc(e.nombre)}<select name="al_${e.id}">${opciones(C.ESTADOS_ALERGENO, ing.alergenos[e.id])}</select></label>`).join('')}</div>
        <label>Trazas (texto de la etiqueta)<input name="trazas" value="${esc(ing.trazas)}" placeholder="Ej.: Puede contener trazas de..."></label>
        <label>Notas de alérgenos<input name="alergenosNotas" value="${esc(ing.alergenosNotas)}"></label>
        <label class="check"><input type="checkbox" name="revisionTerminosConfirmada" ${ing.revisionTerminosConfirmada ? 'checked' : ''}>
          He revisado las coincidencias marcadas «a revisar» (no anula bloqueos ni datos sin indicar)</label>
        <div id="analisis-ing"></div>
      </fieldset>
      <label>Observaciones<textarea name="observaciones">${esc(ing.observaciones)}</textarea></label>`;
  }
  function leerIngrediente() {
    const f = n => dialogo.querySelector(`[name="${n}"]`);
    const ing = Util.clonar(borrador);
    ing.nombre = f('nombre').value; ing.categoriaId = f('categoriaId').value; ing.tipo = f('tipo').value.trim();
    ing.hc = { gramos: Util.aNumero(f('hcGramos').value), base: Util.aNumero(f('hcBase').value), estadoPeso: f('hcEstadoPeso').value };
    ing.fuente = { clase: f('fuenteClase').value, detalle: f('fuenteDetalle').value.trim() };
    ing.verificado = f('verificado').checked; ing.procesado = f('procesado').checked;
    ing.composicion = f('composicion').value; ing.composicionCompleta = f('composicionCompleta').checked;
    C.EXCLUSIONES.forEach(e => { ing.alergenos[e.id] = f('al_' + e.id).value; });
    ing.trazas = f('trazas').value; ing.alergenosNotas = f('alergenosNotas').value;
    ing.revisionTerminosConfirmada = f('revisionTerminosConfirmada').checked; ing.observaciones = f('observaciones').value;
    if (f('hcGramos').value.trim() && ing.hc.gramos == null) ing.hc.gramos = NaN; // texto no numérico → error al guardar
    if (ing.hc.base == null) ing.hc.base = NaN;
    return ing;
  }
  function pintarAnalisisIngrediente() {
    const caja = dialogo.querySelector('#analisis-ing');
    if (!caja) return;
    const ing = leerIngrediente();
    const al = Alergenos.comprobarIngrediente(ing, Alergenos.terminosActivos(datos));
    caja.innerHTML = `<div class="rotulo" style="margin-top:8px">Comprobación automática</div>${etqAlergia(al.estado)}${listaMotivos(al.motivos)}`;
  }

  /* ---- Receta ---- */
  function formularioReceta(rec) {
    return `${rec.ejemplo ? '<div class="aviso pend">Receta de EJEMPLO con datos ficticios.</div>' : ''}
      <label>Nombre del plato *<input name="nombre" data-rec="nombre" value="${esc(rec.nombre)}"></label>
      <label>Descripción (opcional)<textarea name="descripcion" data-rec="descripcion">${esc(rec.descripcion)}</textarea></label>
      <fieldset><legend>Ingredientes</legend><div id="lineas-receta"></div>
        <button class="pequeno" data-accion="linea-nueva">+ Añadir ingrediente</button>
        ${datos.ingredientes.length ? '' : '<p class="suave">Primero crea ingredientes en la sección Ingredientes.</p>'}
      </fieldset>
      <fieldset><legend>Cálculo y comprobaciones</legend><div id="resumen-receta"></div></fieldset>
      <label>Observaciones<textarea name="observaciones" data-rec="observaciones">${esc(rec.observaciones)}</textarea></label>`;
  }
  function pintarLineasReceta() {
    const caja = dialogo.querySelector('#lineas-receta');
    const ings = datos.ingredientes.slice().sort((a, b) => Util.compararTexto(a.nombre, b.nombre));
    const terminos = Alergenos.terminosActivos(datos);
    caja.innerHTML = borrador.lineas.map((l, idx) => `<div class="linea-receta">
        <label>Ingrediente<select data-linea="${idx}" data-campo="ingredienteId"><option value="">— Elige —</option>
          ${ings.map(i => { const b = Alergenos.comprobarIngrediente(i, terminos).estado === 'bloqueada';
            return `<option value="${esc(i.id)}"${i.id === l.ingredienteId ? ' selected' : ''}>${esc(nombreConEjemplo(i))} · ${esc(Datos.nombreCategoria(datos, i.categoriaId))}${b ? ' ✕ BLOQUEADO' : ''}</option>`; }).join('')}
        </select></label>
        <div class="rejilla3"><label>Gramos<input inputmode="decimal" data-linea="${idx}" data-campo="gramos" value="${l.gramos == null ? '' : esc(l.gramos)}"></label>
          <label>Peso<select data-linea="${idx}" data-campo="estadoPeso">${opciones(C.ESTADOS_PESO, l.estadoPeso)}</select></label>
          <button class="pequeno peligro" data-accion="linea-borrar" data-linea="${idx}">Quitar</button></div>
      </div>`).join('') || '<p class="suave">Sin ingredientes.</p>';
  }
  function pintarResumenReceta() {
    const caja = dialogo.querySelector('#resumen-receta');
    const lineasValidas = Object.assign({}, borrador, { lineas: borrador.lineas.filter(l => l.ingredienteId) });
    const calc = Hidratos.calcularReceta(lineasValidas, datos);
    const al = Alergenos.comprobarReceta(lineasValidas, datos);
    caja.innerHTML = `<div class="fila">${etqHc(calc.estado)} ${etqAlergia(al.estado)}</div>${tablaHidratos(calc)}
      <small class="suave">${textoReferenciaHc()}</small>${listaMotivos(al.motivos)}`;
  }

  /* ---- Regla ---- */
  function formularioRegla(r) {
    return `${r.ejemplo ? '<div class="aviso pend">Regla de EJEMPLO. Revísala antes de activarla.</div>' : ''}
      <label>Nombre *<input name="nombre" value="${esc(r.nombre)}"></label>
      <label>Descripción<textarea name="descripcion">${esc(r.descripcion)}</textarea></label>
      <fieldset><legend>Condición (comida del colegio)</legend>
        <div class="rejilla3"><label>Si la comida<select name="condComida">${opciones({ incluye: 'incluye', no_incluye: 'NO incluye' }, r.condicion.comida)}</select></label>
          <label>Categoría<select name="condCategoria">${opcionesCategorias(r.condicion.categoriaId)}</select></label>
          <label>Tipo (opcional)<input name="condTipo" value="${esc(r.condicion.tipo)}"></label></div>
      </fieldset>
      <fieldset><legend>Acción (cena)</legend>
        <div class="rejilla3"><label>La cena debe<select name="accCena">${opciones({ incluir: 'incluir', evitar: 'evitar', evitar_mismo_tipo: 'no repetir el tipo' }, r.accion.cena)}</select></label>
          <label>Categoría<select name="accCategoria">${opcionesCategorias(r.accion.categoriaId)}</select></label>
          <label>Tipo (opcional)<input name="accTipo" value="${esc(r.accion.tipo)}"></label></div>
        <small class="suave">«No repetir el tipo» compara el campo «tipo» de la comida y de los ingredientes (p. ej. arroz frente a pasta). El campo «tipo» de la acción no se usa en ese caso.</small>
      </fieldset>
      <div class="rejilla2"><label>Prioridad (1 = máxima)<input name="prioridad" inputmode="numeric" value="${esc(r.prioridad)}"></label>
        <label class="check" style="margin-top:26px"><input type="checkbox" name="activa" ${r.activa ? 'checked' : ''}> Activa</label></div>
      <div class="aviso info" id="frase-regla"></div>`;
  }
  function leerRegla() {
    const f = n => dialogo.querySelector(`[name="${n}"]`);
    const r = Util.clonar(borrador);
    r.nombre = f('nombre').value; r.descripcion = f('descripcion').value;
    r.condicion = { comida: f('condComida').value, categoriaId: f('condCategoria').value, tipo: f('condTipo').value.trim() };
    r.accion = { cena: f('accCena').value, categoriaId: f('accCategoria').value, tipo: f('accCena').value === 'evitar_mismo_tipo' ? '' : f('accTipo').value.trim() };
    const p = Util.aNumero(f('prioridad').value); r.prioridad = p == null ? NaN : p;
    r.activa = f('activa').checked;
    return r;
  }
  function pintarFraseRegla() { const c = dialogo.querySelector('#frase-regla'); if (c) c.textContent = Reglas.describir(leerRegla(), datos); }

  function guardarDialogo() {
    let r;
    if (tipoBorrador === 'ingrediente') r = Ingredientes.guardar(datos, leerIngrediente());
    else if (tipoBorrador === 'receta') r = Recetas.guardar(datos, borrador);
    else if (tipoBorrador === 'regla') r = Reglas.guardar(datos, leerRegla());
    if (!r.ok) { mensaje(r.error, 4500); return; }
    cerrarDialogo(); persistir(); mensaje('Guardado');
  }

  /* =======================================================
     PINTADO Y NAVEGACIÓN
     ======================================================= */
  const PINTORES = { semana: vistaSemana, menu: vistaMenu, recetas: vistaRecetas, ingredientes: vistaIngredientes,
                     reglas: vistaReglas, alergenos: vistaAlergenos, ajustes: vistaAjustes };
  function pintar() {
    const v = vistaActual();
    $('#pestanas').innerHTML = VISTAS.map(([id, t]) => `<a href="#${id}" class="${id === v ? 'activa' : ''}">${t}</a>`).join('');
    const scroll = window.scrollY;
    $('#vista').innerHTML = (avisoInicial ? `<div class="aviso bloq">${esc(avisoInicial)}</div>` : '') + PINTORES[v]();
    window.scrollTo(0, scroll);
  }
  let avisoInicial = carga.aviso || null;
  window.addEventListener('hashchange', () => { window.scrollTo(0, 0); pintar(); });

  /* =======================================================
     EVENTOS (delegados)
     ======================================================= */
  const temporizadores = {};
  function guardarDiferido(clave) { clearTimeout(temporizadores[clave]); temporizadores[clave] = setTimeout(() => persistir(true), 400); }

  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-accion]');
    if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
    const a = el.dataset.accion, id = el.dataset.id, dia = el.dataset.dia;
    switch (a) {
      /* Diálogo */
      case 'dlg-cerrar': cerrarDialogo(); break;
      case 'dlg-guardar': guardarDialogo(); break;
      /* Menú */
      case 'sugerir': { const n = MenuEscolar.sugerirComponentes(datos, dia); persistir(); mensaje(n ? `${n} sugerencia(s) añadida(s). Revísalas y confírmalas.` : 'No hay sugerencias nuevas.'); break; }
      case 'comp-nuevo': datos.menuColegio[dia].componentes.push(Datos.nuevoComponente('', 'otra', '', 'manual')); persistir(); break;
      case 'comp-borrar': datos.menuColegio[dia].componentes = datos.menuColegio[dia].componentes.filter(c => c.id !== el.dataset.comp); persistir(); break;
      case 'vaciar-semana': if (confirm('¿Vaciar el menú de los cinco días, las cenas elegidas a mano y la revisión de alérgenos?')) { MenuEscolar.vaciarSemana(datos); persistir(); } break;
      case 'pc-nueva': {
        const termino = $('#pc-termino').value.trim();
        if (!termino) { mensaje('Escribe una palabra.'); break; }
        datos.palabrasClave.push({ id: Util.generarId('pc'), termino, categoriaId: $('#pc-categoria').value, tipo: $('#pc-tipo').value.trim() });
        persistir(); break;
      }
      case 'pc-borrar': datos.palabrasClave = datos.palabrasClave.filter(p => p.id !== id); persistir(); break;
      /* Ingredientes */
      case 'ing-nuevo': { const ing = Datos.nuevoIngrediente(); abrirDialogo('Nuevo ingrediente', formularioIngrediente(ing), 'ingrediente', ing); pintarAnalisisIngrediente(); break; }
      case 'ing-editar': { const ing = Ingredientes.buscar(datos, id); abrirDialogo('Ingrediente', formularioIngrediente(ing), 'ingrediente', Util.clonar(ing)); pintarAnalisisIngrediente(); break; }
      case 'ing-borrar': {
        const ing = Ingredientes.buscar(datos, id);
        if (!confirm(`¿Eliminar el ingrediente «${ing.nombre}»?`)) break;
        const r = Ingredientes.eliminar(datos, id); if (!r.ok) mensaje(r.error, 5000); else persistir(); break;
      }
      /* Recetas */
      case 'receta-nueva': { const r = Datos.nuevaReceta(); abrirDialogo('Nueva receta', formularioReceta(r), 'receta', r); pintarLineasReceta(); pintarResumenReceta(); break; }
      case 'receta-editar': { const r = Util.clonar(Recetas.buscar(datos, id)); abrirDialogo('Receta', formularioReceta(r), 'receta', r); pintarLineasReceta(); pintarResumenReceta(); break; }
      case 'receta-duplicar': { Recetas.duplicar(datos, id); persistir(); mensaje('Receta duplicada'); break; }
      case 'receta-borrar': {
        const r = Recetas.buscar(datos, id); const dias = Recetas.diasConEleccion(datos, id);
        if (confirm(`¿Eliminar la receta «${r.nombre}»?${dias.length ? ' Está elegida para: ' + dias.join(', ') + '.' : ''}`)) { Recetas.eliminar(datos, id); persistir(); }
        break;
      }
      case 'linea-nueva': borrador.lineas.push(Datos.nuevaLinea()); pintarLineasReceta(); pintarResumenReceta(); break;
      case 'linea-borrar': borrador.lineas.splice(Number(el.dataset.linea), 1); pintarLineasReceta(); pintarResumenReceta(); break;
      /* Reglas */
      case 'regla-nueva': { const r = Datos.nuevaRegla(); abrirDialogo('Nueva regla', formularioRegla(r), 'regla', r); pintarFraseRegla(); break; }
      case 'regla-editar': { const r = Util.clonar(datos.reglas.find(x => x.id === id)); abrirDialogo('Regla', formularioRegla(r), 'regla', r); pintarFraseRegla(); break; }
      case 'regla-borrar': { const r = datos.reglas.find(x => x.id === id); if (confirm(`¿Eliminar la regla «${r.nombre}»?`)) { Reglas.eliminar(datos, id); persistir(); } break; }
      /* Alérgenos */
      case 'rev-confirmar': {
        const fase = el.dataset.fase; const plan = Planificador.planificarSemana(datos);
        const r = Revision.confirmar(datos, fase, plan.huella);
        if (!r.ok) { mensaje(r.error); break; }
        marcasRevision[fase].clear(); if (fase === 'fase1') marcasRevision.fase2.clear();
        persistir(); mensaje('Revisión confirmada'); break;
      }
      case 'ter-nuevo': {
        const r = Alergenos.agregarTermino(datos, $('#ter-termino').value, $('#ter-exclusion').value, $('#ter-accion').value);
        if (!r.ok) mensaje(r.error); else { persistir(); mensaje('Término añadido'); }
        break;
      }
      case 'ter-borrar': if (confirm('¿Quitar este término de la lista?')) { Alergenos.eliminarTermino(datos, id); persistir(); } break;
      /* Ajustes */
      case 'exportar': exportar(); break;
      case 'cat-nueva': {
        const nombre = $('#cat-nueva').value.trim(); if (!nombre) break;
        datos.categorias.push({ id: Util.generarId('cat'), nombre }); persistir(); break;
      }
      case 'cat-borrar': {
        const usada = datos.ingredientes.some(i => i.categoriaId === id) || datos.palabrasClave.some(p => p.categoriaId === id) ||
          datos.reglas.some(r => r.condicion.categoriaId === id || r.accion.categoriaId === id) ||
          Object.values(datos.menuColegio).some(m => m.componentes.some(c => c.categoriaId === id));
        if (usada) { mensaje('No se puede quitar: la usan ingredientes, reglas, palabras clave o el menú.', 4500); break; }
        if (datos.categorias.length <= 1) { mensaje('Debe quedar al menos una categoría.'); break; }
        datos.categorias = datos.categorias.filter(c => c.id !== id); persistir(); break;
      }
      case 'borrar-ejemplos': borrarEjemplos(); break;
    }
  });

  document.addEventListener('input', ev => {
    const el = ev.target;
    // Dentro del diálogo
    if (dialogo.contains(el)) {
      if (tipoBorrador === 'ingrediente') pintarAnalisisIngrediente();
      if (tipoBorrador === 'regla') pintarFraseRegla();
      if (tipoBorrador === 'receta') {
        if (el.dataset.rec) borrador[el.dataset.rec] = el.value;
        if (el.dataset.linea != null && el.dataset.campo === 'gramos') { borrador.lineas[Number(el.dataset.linea)].gramos = Util.aNumero(el.value); pintarResumenReceta(); }
      }
      return;
    }
    const a = el.dataset.accion;
    if (a === 'menu-texto') { datos.menuColegio[el.dataset.dia].texto = el.value; guardarDiferido('menu-' + el.dataset.dia); }
    if (a === 'filtro-ingredientes' || a === 'filtro-recetas') {
      if (a === 'filtro-ingredientes') filtroIngredientes = el.value; else filtroRecetas = el.value;
      const pos = el.selectionStart; pintar();
      const nuevo = document.querySelector(`[data-accion="${a}"]`); nuevo.focus(); nuevo.setSelectionRange(pos, pos);
    }
  });

  document.addEventListener('change', ev => {
    const el = ev.target;
    if (dialogo.contains(el)) {
      if (tipoBorrador === 'receta' && el.dataset.linea != null) {
        const linea = borrador.lineas[Number(el.dataset.linea)];
        if (el.dataset.campo === 'ingredienteId') {
          linea.ingredienteId = el.value;
          const ing = Ingredientes.buscar(datos, el.value);
          if (ing) linea.estadoPeso = ing.hc.estadoPeso; // por defecto, el mismo estado que el dato de la ficha
          pintarLineasReceta();
        }
        if (el.dataset.campo === 'estadoPeso') linea.estadoPeso = el.value;
        if (el.dataset.campo === 'gramos') linea.gramos = Util.aNumero(el.value);
        pintarResumenReceta();
      }
      if (tipoBorrador === 'ingrediente') pintarAnalisisIngrediente();
      if (tipoBorrador === 'regla') pintarFraseRegla();
      return;
    }
    const a = el.dataset.accion;
    if (a === 'menu-texto') { datos.menuColegio[el.dataset.dia].texto = el.value; persistir(true); }
    if (a === 'comp-campo') {
      const comp = datos.menuColegio[el.dataset.dia].componentes.find(c => c.id === el.dataset.comp);
      comp[el.dataset.campo] = el.type === 'checkbox' ? el.checked : el.value;
      // Los cuadros de texto no se repintan (para no perder el foco); casillas y desplegables sí.
      persistir(el.type !== 'checkbox' && el.tagName !== 'SELECT');
    }
    if (a === 'elegir-cena') { datos.eleccionManual[el.dataset.dia] = el.value || null; persistir(); }
    if (a === 'regla-activa') { datos.reglas.find(r => r.id === el.dataset.id).activa = el.checked; persistir(); }
    if (a === 'rev-marca') {
      const set = marcasRevision[el.dataset.fase]; const i = Number(el.dataset.i);
      if (el.checked) set.add(i); else set.delete(i); pintar();
    }
    if (a === 'cat-nombre') {
      const nombre = el.value.trim(); if (!nombre) { mensaje('El nombre no puede estar vacío.'); pintar(); return; }
      datos.categorias.find(c => c.id === el.dataset.id).nombre = nombre; persistir();
    }
    if (a === 'importar' && el.files && el.files[0]) importar(el.files[0]);
  });

  /* =======================================================
     IMPORTAR / EXPORTAR (parte de interfaz)
     ======================================================= */
  function exportar() {
    const copia = CopiaSeguridad.crearCopia(datos);
    const blob = new Blob([JSON.stringify(copia, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const enlace = document.createElement('a');
    enlace.href = url; enlace.download = CopiaSeguridad.nombreArchivo();
    document.body.appendChild(enlace); enlace.click(); enlace.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    mensaje('Copia descargada. Guárdala en un lugar seguro (por ejemplo, tu nube o correo).', 4500);
  }

  function importar(archivo) {
    const lector = new FileReader();
    lector.onload = () => {
      const r = CopiaSeguridad.leerCopia(String(lector.result));
      if (!r.ok) { alert('No se ha podido importar la copia:\n\n• ' + r.errores.join('\n• ')); pintar(); return; }
      const fecha = r.exportado ? new Date(r.exportado).toLocaleString('es-ES') : 'fecha desconocida';
      const ok = confirm(`Se SUSTITUIRÁN todos los datos actuales (${CopiaSeguridad.resumen(datos)})\n` +
        `por los de la copia del ${fecha} (${CopiaSeguridad.resumen(r.datos)}).\n\n¿Continuar?`);
      if (!ok) { pintar(); return; }
      datos = r.datos; avisoInicial = null; persistir(); mensaje('Copia importada correctamente');
    };
    lector.onerror = () => alert('No se ha podido leer el archivo.');
    lector.readAsText(archivo);
  }

  function borrarEjemplos() {
    if (!confirm('¿Eliminar los ingredientes, recetas y reglas de ejemplo?')) return;
    const recetasEj = datos.recetas.filter(r => r.ejemplo).map(r => r.id);
    recetasEj.forEach(id => Recetas.eliminar(datos, id));
    datos.reglas = datos.reglas.filter(r => !r.ejemplo);
    let conservados = 0;
    datos.ingredientes.filter(i => i.ejemplo).forEach(i => { if (!Ingredientes.eliminar(datos, i.id).ok) conservados++; });
    persistir();
    mensaje(conservados ? `Hecho. ${conservados} ingrediente(s) de ejemplo se conservan porque los usan recetas tuyas.` : 'Datos de ejemplo eliminados.', 4500);
  }

  /* PWA: aquí se registraría el service worker en el futuro:
     if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); */

  pintar();
})();
</script>
